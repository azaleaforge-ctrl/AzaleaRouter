name: CodeQL

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "security/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

      - name: Summarize open CodeQL alerts for analyzed ref
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_REF: ${{ github.ref }}
          CODEQL_PR: ${{ github.event.pull_request.number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          query_args=(-f state=open -F per_page=100)
          if [[ -n "${CODEQL_PR}" ]]; then
            query_args+=(-F "pr=${CODEQL_PR}")
          else
            query_args+=(-f "ref=${CODEQL_REF}")
          fi
          alerts="$(gh api --paginate -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" "${query_args[@]}" --jq '.[] | "- Alert #\(.number): \(.rule.id) — \(.rule.security_severity_level // .rule.severity // "unknown") — \(.most_recent_instance.location.path // "unknown"): \(.most_recent_instance.location.start_line // 0)"')"
          {
            echo "## CodeQL alert inventory"
            echo
            echo "Analyzed ref: ${CODEQL_REF}"
            echo
            if [[ -z "${alerts}" ]]; then
              echo "No open CodeQL alerts were returned for this ref."
            else
              echo "Open alerts require manual triage. This report does not dismiss, suppress, or reclassify findings."
              echo
              echo "${alerts}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${alerts}" ]]; then
            echo "::warning::Open CodeQL alerts exist for ${CODEQL_REF}; review the step summary before any merge."
          fi
