name: AzaleaRouter CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: azalea-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install dependencies and regenerate lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint all workspace packages
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: API lint
        run: pnpm --filter @azalea-router/api lint

      - name: API typecheck
        run: pnpm --filter @azalea-router/api typecheck

      - name: API build
        run: pnpm --filter @azalea-router/api build

      - name: API unit and integration tests
        run: pnpm --filter @azalea-router/api test

      - name: Worker lint
        run: pnpm --filter @azalea-router/worker lint

      - name: Worker typecheck
        run: pnpm --filter @azalea-router/worker typecheck

      - name: Worker build
        run: pnpm --filter @azalea-router/worker build

      - name: Worker unit and Redis integration tests
        run: pnpm --filter @azalea-router/worker test

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- pnpm-lock.yaml
