name: AzaleaRouter CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: azalea-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install dependencies and regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      # Temporary artifact to bring the pnpm-generated lockfile back into the
      # review branch. Remove this step once the generated lockfile is committed.
      - name: Upload generated workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2

      - name: Lint all workspace packages
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: API lint
        run: pnpm --filter @azalea-router/api lint

      - name: API typecheck
        run: pnpm --filter @azalea-router/api typecheck

      - name: API build
        run: pnpm --filter @azalea-router/api build

      - name: API unit and integration tests
        run: pnpm --filter @azalea-router/api test

      - name: Verify committed lockfile is current
        run: git diff --exit-code -- pnpm-lock.yaml
