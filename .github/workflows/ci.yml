name: AzaleaRouter CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: azalea-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install dependencies and regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      # Temporary artifact to bring the pnpm-generated lockfile back into the
      # review branch. Remove after the generated lockfile has been committed.
      - name: Upload generated workspace lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2

      - name: Lint all workspace packages
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: API lint
        run: pnpm --filter @azalea-router/api lint

      - name: API typecheck
        run: pnpm --filter @azalea-router/api typecheck

      - name: API build
        run: pnpm --filter @azalea-router/api build

      - name: API unit and integration tests
        run: pnpm --filter @azalea-router/api test

      - name: Worker lint
        run: pnpm --filter @azalea-router/worker lint

      - name: Worker typecheck
        run: pnpm --filter @azalea-router/worker typecheck

      - name: Worker build
        run: pnpm --filter @azalea-router/worker build

      - name: Worker unit and Redis integration tests
        run: pnpm --filter @azalea-router/worker test


  sync-lockfile:
    name: Commit generated workspace lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/backend-foundation-be1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout BE-1 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/backend-foundation-be1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Generate complete workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile only to BE-1 feature branch
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Workspace lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(pnpm): sync workspace lockfile"
          git push origin HEAD:refs/heads/feat/backend-foundation-be1
