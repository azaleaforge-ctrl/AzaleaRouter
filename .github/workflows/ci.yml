name: AzaleaRouter CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azalea-router-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: azalea_router_test
          POSTGRES_USER: azalea
          POSTGRES_PASSWORD: local-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azalea -d azalea_router_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://azalea:local-ci-only-password@127.0.0.1:5432/azalea_router_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Install dependencies
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Upload generated workspace lockfile
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: generated-workspace-lockfile-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: warn
          retention-days: 3

      - name: Lint all workspace packages
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend build
        run: pnpm build

      - name: Frontend unit tests
        run: pnpm test

      - name: Database package lint
        run: pnpm --filter @azalea-router/database lint

      - name: Validate PostgreSQL schema
        run: pnpm --filter @azalea-router/database db:validate

      - name: Generate Prisma Client
        run: pnpm --filter @azalea-router/database db:generate

      - name: Apply committed database migrations
        run: pnpm --filter @azalea-router/database db:migrate:deploy

      - name: Database package typecheck and build
        run: pnpm --filter @azalea-router/database build

      - name: Database unit tests
        run: pnpm --filter @azalea-router/database test

      - name: API lint
        run: pnpm --filter @azalea-router/api lint

      - name: API typecheck
        run: pnpm --filter @azalea-router/api typecheck

      - name: API build
        run: pnpm --filter @azalea-router/api build

      - name: API unit and integration tests
        run: pnpm --filter @azalea-router/api test

      - name: Worker lint
        run: pnpm --filter @azalea-router/worker lint

      - name: Worker typecheck
        run: pnpm --filter @azalea-router/worker typecheck

      - name: Worker build
        run: pnpm --filter @azalea-router/worker build

      - name: Worker unit and Redis integration tests
        run: pnpm --filter @azalea-router/worker test

  lockfile-sync:
    name: Commit generated workspace lockfile and verify frozen install
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'feat/')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: generated-workspace-lockfile-${{ github.sha }}
          path: .lockfile-artifact

      - name: Commit generated lockfile when changed
        id: commit-lockfile
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          cp .lockfile-artifact/pnpm-lock.yaml pnpm-lock.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): sync pnpm workspace lockfile"
          git push origin "HEAD:${BRANCH_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head frozen-lockfile validation
        if: steps.commit-lockfile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH_NAME}\"}"
