name: Secret scanning (Gitleaks)

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "security/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan reachable Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history without persisting credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable refs (redact findings in stdout)
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --no-banner --no-color --log-opts=--all .
