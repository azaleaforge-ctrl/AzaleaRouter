packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 requires explicit approval for dependency install scripts.
# Approve only scripts needed by the build/test toolchain and Prisma 7 client generation.
# Do not blanket-allow dependency build scripts.
allowBuilds:
  esbuild: true
  msgpackr-extract@3.0.7: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
