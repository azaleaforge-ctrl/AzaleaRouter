openapi: 3.1.0
info:
  title: AzaleaRouter API
  version: 0.1.0
  description: |
    Initial backend contract. Routes are added only when their implementation,
    authentication policy, validation and tests are available.
servers:
  - url: /api/v1
    description: Versioned AzaleaRouter website API
paths:
  /health:
    get:
      operationId: getHealth
      summary: API health check
      security: []
      responses:
        "200":
          description: API process is responding
          headers:
            x-request-id:
              schema:
                type: string
              description: Request correlation identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          const: ok
        service:
          const: azalea-router-api
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check including required database connectivity
      security: []
      responses:
        "200":
          description: API and configured database are ready
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies, request_id]
                properties:
                  status:
                    const: ready
                  dependencies:
                    type: object
                    properties:
                      database:
                        const: ok
                  request_id:
                    type: string
        "503":
          description: A required dependency is not configured or unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies, request_id]
                properties:
                  status:
                    const: not_ready
                  dependencies:
                    type: object
                    properties:
                      database:
                        enum: [not_configured, unavailable]
                  request_id:
                    type: string
