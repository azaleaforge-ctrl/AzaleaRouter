openapi: 3.1.0
info:
  title: AzaleaRouter API
  version: 0.2.0
  description: |
    Versioned website API. Cookie authentication is enabled only when an
    approved provider adapter and all required security configuration exist.
servers:
  - url: /api/v1
    description: Versioned AzaleaRouter website API
paths:
  /health:
    get:
      operationId: getHealth
      summary: API liveness check
      security: []
      responses:
        "200":
          description: API process is responding
          headers:
            x-request-id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness check including required database connectivity
      security: []
      responses:
        "200":
          description: API and configured database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Database is not configured or is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Read optional current browser session
      security: []
      responses:
        "200":
          description: Session state; unauthenticated is a normal response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/register:
    post:
      operationId: registerAccount
      summary: Create account and record explicit current Terms and Privacy consent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration request accepted; email verification may be required
          content:
            application/json:
              schema:
                type: object
                required: [accepted, email_verification_required, message]
                properties:
                  accepted:
                    const: true
                  email_verification_required:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/login:
    post:
      operationId: loginAccount
      summary: Authenticate with email and password and issue opaque HttpOnly session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created
          headers:
            Set-Cookie:
              description: HttpOnly session cookie and readable CSRF cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Redeem a one-time email verification token hash
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified and browser session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/email/resend:
    post:
      operationId: resendEmailVerification
      summary: Request another email verification message
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChallengeRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/password/forgot:
    post:
      operationId: requestPasswordRecovery
      summary: Request password recovery email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChallengeRequest"
      responses:
        "202":
          description: Generic response that does not disclose account existence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Redeem recovery token and set a new password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password changed and new browser session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /auth/refresh:
    post:
      operationId: refreshAuthSession
      summary: Refresh access token under a row-locked rotating refresh session
      security:
        - cookieAuth: []
        - csrfHeader: []
      responses:
        "200":
          description: Browser session is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke current session and clear cookies
      security:
        - cookieAuth: []
        - csrfHeader: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /me:
    get:
      operationId: getCurrentAccount
      summary: Read current account and preferences
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /me/profile:
    patch:
      operationId: updateCurrentProfile
      summary: Update current user's profile
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /me/preferences:
    patch:
      operationId: updateCurrentPreferences
      summary: Update current user's preferences
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /me/consents:
    get:
      operationId: getMyConsents
      summary: List append-only consent history
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Consent records for current user
          content:
            application/json:
              schema:
                type: object
                required: [consents]
                properties:
                  consents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: recordMyConsent
      summary: Record a new versioned consent event
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest"
      responses:
        "201":
          description: Consent recorded
          content:
            application/json:
              schema:
                type: object
                required: [consent]
                properties:
                  consent:
                    $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /catalog/status:
    get:
      operationId: getCatalogStatus
      summary: Read source-backed model catalog readiness and latest sync result
      security: []
      responses:
        "200":
          description: Catalog readiness based on distinct active canonical chat models with priced endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStatus"
  /models:
    get:
      operationId: listModels
      summary: List active canonical chat models with verified endpoint pricing
      security: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 120
        - in: query
          name: developer
          schema:
            type: string
            maxLength: 255
        - in: query
          name: provider
          schema:
            type: string
            maxLength: 255
        - in: query
          name: input_modality
          schema:
            type: string
            maxLength: 32
        - in: query
          name: output_modality
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Cursor-paginated canonical models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
  /models/{modelId}:
    get:
      operationId: getModel
      summary: Read a canonical model and source-verified endpoints
      security: []
      parameters:
        - in: path
          name: modelId
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Canonical model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /models/{modelId}/endpoints:
    get:
      operationId: listModelEndpoints
      summary: List active provider endpoints with current source price snapshots
      security: []
      parameters:
        - in: path
          name: modelId
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Available provider endpoints and USD price snapshots
          content:
            application/json:
              schema:
                type: object
                required: [canonical_id, endpoints]
                properties:
                  canonical_id:
                    type: string
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelEndpoint"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /developers:
    get:
      operationId: listDevelopers
      summary: List developers represented by active source-verified catalog models
      security: []
      responses:
        "200":
          description: Active developers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Developer"
  /providers:
    get:
      operationId: listProviders
      summary: List upstream providers serving active priced endpoints
      security: []
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"

  /wallet:
    get:
      operationId: getWalletBalance
      summary: Read current user's IDR wallet ledger balance and active reservations
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Wallet is present or has not been created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /wallet/payment-intents:
    post:
      operationId: createWalletPaymentIntent
      summary: Create an idempotent pending IDR top-up intent
      security:
        - cookieAuth: []
        - csrfHeader: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_idr]
              properties:
                amount_idr:
                  type: string
                  pattern: '^[1-9]\d{0,37}$'
      responses:
        "202":
          description: Pending payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /payments/webhooks:
    post:
      operationId: receiveSignedPaymentWebhook
      summary: Receive a raw-body, provider-signed payment webhook
      security: []
      parameters:
        - in: header
          name: X-Payment-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Verified webhook event processed or safely deduplicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResult"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Signed event rejected because it does not match an active payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentWebhookResult"
        "503":
          $ref: "#/components/responses/ErrorResponse"

  /me/api-keys:
    get:
      operationId: listApiKeys
      summary: List the current user's masked AZL API keys
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Masked API keys; plaintext secrets are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
    post:
      operationId: createApiKey
      summary: Create an AZL API key and reveal its plaintext exactly once
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Newly created key, including one-time plaintext
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedApiKeyResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /me/api-keys/{keyId}/rotate:
    post:
      operationId: rotateApiKey
      summary: Revoke the old key and reveal a replacement exactly once
      security:
        - cookieAuth: []
        - csrfHeader: []
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Replacement API key revealed once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedApiKeyResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /me/api-keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Revoke the current user's API key
      security:
        - cookieAuth: []
        - csrfHeader: []
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revocation state
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    enum: [revoked, rotated, expired]
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /chat/completions:
    post:
      operationId: createChatCompletion
      summary: OpenAI-compatible chat completion endpoint (disabled until upstream/legal and usage settlement gates are satisfied)
      servers:
        - url: /v1
      security:
        - apiKeyBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or server-sent event stream
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"


  /usage/summary:
    get:
      operationId: getUsageSummary
      summary: Read the current user's IDR usage totals
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Aggregated usage and IDR cost totals
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /usage/requests:
    get:
      operationId: listUsageRequests
      summary: List the current user's usage requests
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Cursor-paginated usage requests
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /usage/requests/{requestId}:
    get:
      operationId: getUsageRequest
      summary: Read one usage request owned by the current user
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Usage request details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /usage/exports:
    post:
      operationId: createUsageExport
      summary: Create a bounded CSV export of the current user's usage
      security:
        - cookieAuth: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
      responses:
        "201":
          description: CSV export created
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
  /usage/exports/{id}:
    get:
      operationId: downloadUsageExport
      summary: Download an unexpired usage CSV export owned by the current user
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: UTF-8 CSV file
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
  /usage/model-colors:
    get:
      operationId: listUsageModelColors
      summary: Read persistent model chart colors for the current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User-specific model colors
          content:
            application/json:
              schema:
                type: object
  /usage/model-colors/{modelId}:
    put:
      operationId: setUsageModelColor
      summary: Set a chart color for an active catalog model
      security:
        - cookieAuth: []
        - csrfHeader: []
      parameters:
        - in: path
          name: modelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [color]
              properties:
                color:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
      responses:
        "200":
          description: Updated model color
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /events:
    get:
      operationId: streamUserEvents
      summary: Open an authenticated server-sent event stream with cursor replay
      security:
        - cookieAuth: []
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-sent events scoped to the authenticated user
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

/conversations:
    get:
      operationId: listConversations
      summary: List conversations owned by the current user
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: Cursor-paginated user conversations
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ErrorResponse" }
    post:
      operationId: createConversation
      summary: Create a conversation
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 160 }
                default_model_id: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
  /conversations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getConversation
      summary: Read an owned conversation and recent messages
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Conversation and recent messages
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      operationId: updateConversation
      summary: Rename, archive or restore a conversation
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deleteConversation
      summary: Soft-delete an owned conversation
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      responses:
        "204": { description: Conversation deleted }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /conversations/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listConversationMessages
      summary: List messages in an owned conversation
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cursor-paginated messages
          content:
            application/json:
              schema: { type: object }
    post:
      operationId: createConversationMessage
      summary: Persist a user message with clean file attachments
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 100000 }
                attachment_ids:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: User message persisted
          content:
            application/json:
              schema: { type: object }
        "409": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
  /files:
    post:
      operationId: uploadPrivateFile
      summary: Upload a private file into quarantine for scanning
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      parameters:
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string, maxLength: 255 }
        - in: header
          name: X-File-Mime-Type
          required: true
          schema: { type: string, maxLength: 160 }
        - in: header
          name: X-Conversation-Id
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201": { description: File accepted and marked clean by the configured scanner }
        "202": { description: File stored in quarantine while scanner verdict is unknown }
        "413": { $ref: "#/components/responses/ErrorResponse" }
        "415": { $ref: "#/components/responses/ErrorResponse" }
    get:
      operationId: listPrivateFiles
      summary: List private files owned by the current user
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: status
          schema: { type: string, enum: [quarantined, clean, rejected, deleted] }
      responses:
        "200":
          description: User-owned file metadata
          content:
            application/json:
              schema: { type: object }
  /files/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadPrivateFile
      summary: Download an owned file only after a clean scanner verdict and hash check
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Verified private binary file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/ErrorResponse" }
        "423": { $ref: "#/components/responses/ErrorResponse" }
    delete:
      operationId: deletePrivateFile
      summary: Soft-delete an owned private file
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      responses:
        "204": { description: File deleted }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current user
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: unread_only
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Cursor-paginated notifications
          content:
            application/json:
              schema: { type: object }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      summary: Mark one owned notification as read
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Notification marked as read }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all current-user notifications as read
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      responses:
        "200":
          description: Count of updated notifications
          content:
            application/json:
              schema: { type: object }
  /support/tickets:
    get:
      operationId: listSupportTickets
      summary: List support tickets owned by the current user
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: User-owned tickets
          content:
            application/json:
              schema: { type: object }
    post:
      operationId: createSupportTicket
      summary: Create a support ticket
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, category, body]
              properties:
                subject: { type: string, minLength: 5, maxLength: 160 }
                category: { type: string, enum: [account, billing, technical, model, other] }
                body: { type: string, minLength: 2, maxLength: 20000 }
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema: { type: object }
  /support/tickets/{id}:
    get:
      operationId: getSupportTicket
      summary: Read a support ticket owned by the current user
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ticket and customer-visible messages
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /support/tickets/{id}/replies:
    post:
      operationId: replyToSupportTicket
      summary: Reply to an owned support ticket
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 20000 }
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /support/assigned:
    get:
      operationId: listAssignedSupportTickets
      summary: List tickets assigned to the authenticated support agent
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Assigned support tickets
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /support/assigned/{id}:
    get:
      operationId: getAssignedSupportTicket
      summary: Read a ticket explicitly assigned to the authenticated support agent
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assigned ticket including staff-only notes
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /support/assigned/{id}/replies:
    post:
      operationId: replyToAssignedSupportTicket
      summary: Add a customer-visible reply or internal note to an assigned ticket
      security: [{ cookieAuth: [] }, { csrfHeader: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 2, maxLength: 20000 }
                visibility: { type: string, enum: [public, internal], default: public }
      responses:
        "201":
          description: Support message created
          content:
            application/json:
              schema: { type: object }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /content/{type}:
    get:
      operationId: listPublishedContent
      summary: List published documentation, help, blog, status and changelog entries
      security: []
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [docs, help, blog, status, changelog] }
        - in: query
          name: locale
          schema: { type: string, default: id-ID }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Published content entries
          content:
            application/json:
              schema: { type: object }
  /content/{type}/{slug}:
    get:
      operationId: getPublishedContent
      summary: Read a published CMS entry
      security: []
      parameters:
        - in: path
          name: type
          required: true
          schema: { type: string, enum: [docs, help, blog, status, changelog] }
        - in: path
          name: slug
          required: true
          schema: { type: string, maxLength: 180 }
        - in: query
          name: locale
          schema: { type: string, default: id-ID }
      responses:
        "200":
          description: Published content entry
          content:
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/ErrorResponse" }


  /admin/operations/summary:
    get:
      operationId: getAdminOperationsSummary
      summary: Read safe backend operations counters
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current operational counters
          content:
            application/json:
              schema:
                type: object
                required: [as_of, counts]
                properties:
                  as_of: { type: string, format: date-time }
                  counts:
                    type: object
                    properties:
                      usage_reconciliation_required: { type: integer, minimum: 0 }
                      payment_webhooks_pending_or_failed: { type: integer, minimum: 0 }
                      outbox_events_pending: { type: integer, minimum: 0 }
                      files_quarantined: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /admin/usage/reconciliation:
    get:
      operationId: listAdminUsageReconciliation
      summary: List usage records requiring manual reconciliation
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cursor-paginated reconciliation records with decimal-safe amounts
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: Search audit metadata without exposing raw before/after snapshots
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, format: uuid }
        - in: query
          name: actor_id
          schema: { type: string, format: uuid }
        - in: query
          name: action
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: resource_type
          schema: { type: string, minLength: 1, maxLength: 80 }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Cursor-paginated audit metadata; sensitive snapshots are not returned
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }

components:
  securitySchemes:
    apiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: AZL
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-azlr_session
      description: |
        Opaque HttpOnly session cookie. Local HTTP development uses azlr_session;
        production requires Secure and uses the __Host- prefix. Provider access
        and refresh tokens remain encrypted in PostgreSQL and are never exposed.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the readable azlr_csrf cookie; mutation routes also require an allowlisted Origin.
  responses:
    ErrorResponse:
      description: Standard redacted error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          const: ok
        service:
          const: azalea-router-api
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, dependencies, request_id]
      properties:
        status:
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              enum: [ok, not_configured, unavailable]
        request_id:
          type: string

    WalletResponse:
      type: object
      required: [wallet]
      properties:
        wallet:
          type: object
          required: [currency, ledgerBalance, reservedBalance, availableBalance, status]
          properties:
            currency:
              const: IDR
            ledgerBalance:
              type: string
              pattern: '^\\d+$'
            reservedBalance:
              type: string
              pattern: '^\\d+$'
            availableBalance:
              type: string
              pattern: '^\\d+$'
            status:
              type: string
    PaymentIntentResponse:
      type: object
      required: [payment_intent]
      properties:
        payment_intent:
          type: object
          required: [id, provider, provider_reference, amount_idr, currency, status, expires_at, checkout_url]
          properties:
            id:
              type: string
              format: uuid
            provider:
              type: string
            provider_reference:
              type: string
            amount_idr:
              type: string
              pattern: '^\\d+$'
            currency:
              const: IDR
            status:
              enum: [pending, processing, paid, failed, expired, refunded]
            expires_at:
              type: string
              format: date-time
            checkout_url:
              type: "null"
    PaymentWebhookResult:
      type: object
      required: [accepted, duplicate, status, paymentIntentId]
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        status:
          enum: [processed, rejected, failed]
        paymentIntentId:
          type: [string, "null"]
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          items:
            const: chat:completions
          default: [chat:completions]
        allowed_model_ids:
          type: array
          maxItems: 100
          items:
            type: string
        spend_limit_idr:
          type: string
          pattern: '^(?:0|[1-9]\\d{0,37})$'
        rate_limit_rpm:
          type: integer
          minimum: 1
          maximum: 10000
          default: 60
        concurrency_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 2
        expires_at:
          type: string
          format: date-time
    ApiKeyListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, name, key_prefix, scopes, allowed_model_ids, status, created_at]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              key_prefix:
                type: string
              scopes:
                type: array
                items:
                  type: string
              allowed_model_ids:
                type: array
                items:
                  type: string
              status:
                type: string
              created_at:
                type: string
                format: date-time
    IssuedApiKeyResponse:
      type: object
      required: [api_key, warning]
      properties:
        api_key:
          type: object
          required: [id, name, key_prefix, api_key, scopes, allowed_model_ids, created_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            key_prefix:
              type: string
            api_key:
              type: string
              writeOnly: true
              pattern: '^AZL-[A-Za-z0-9_-]{43}$'
            scopes:
              type: array
              items:
                type: string
            allowed_model_ids:
              type: array
              items:
                type: string
            spend_limit_idr:
              type: [string, "null"]
            rate_limit_rpm:
              type: integer
            concurrency_limit:
              type: integer
            expires_at:
              type: [string, "null"]
            created_at:
              type: string
              format: date-time
        warning:
          type: string
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required: [role, content]
            properties:
              role:
                enum: [system, developer, user, assistant, tool]
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        stream:
          type: boolean
        endpoint_id:
          type: string
          format: uuid
    CatalogStatus:
      type: object
      required: [source, minimum_required_models, active_canonical_chat_models, ready_for_public_catalog, last_sync]
      properties:
        source:
          const: openrouter
        minimum_required_models:
          const: 50
        active_canonical_chat_models:
          type: integer
          minimum: 0
        ready_for_public_catalog:
          type: boolean
        last_sync:
          oneOf:
            - $ref: "#/components/schemas/CatalogSyncRun"
            - type: "null"
    CatalogSyncRun:
      type: object
      required: [id, status, started_at, discovered_models, validated_models, active_models, discovered_endpoints, price_snapshots]
      properties:
        id:
          type: string
          format: uuid
        status:
          enum: [running, succeeded, partial, failed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        discovered_models:
          type: integer
        validated_models:
          type: integer
        active_models:
          type: integer
        discovered_endpoints:
          type: integer
        price_snapshots:
          type: integer
        error_code:
          type: [string, "null"]
    ModelListResponse:
      type: object
      required: [data, page, catalog_ready, total_active_models]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        page:
          type: object
          required: [limit, next_cursor]
          properties:
            limit:
              type: integer
            next_cursor:
              type: [string, "null"]
        catalog_ready:
          type: boolean
        total_active_models:
          type: integer
    Model:
      type: object
      required: [id, canonical_id, source_model_id, name, input_modalities, output_modalities, supported_parameters, endpoints, last_verified_at]
      properties:
        id:
          type: string
          format: uuid
        canonical_id:
          type: string
        source_model_id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        developer:
          oneOf:
            - $ref: "#/components/schemas/DeveloperIdentity"
            - type: "null"
        context_length:
          type: [integer, "null"]
        max_completion_tokens:
          type: [integer, "null"]
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        supported_parameters:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ModelEndpoint"
        last_verified_at:
          type: string
          format: date-time
    ModelEndpoint:
      type: object
      required: [id, provider, name, api_path, supported_parameters, source_fetched_at, pricing]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/DeveloperIdentity"
        name:
          type: string
        model_variant:
          type: [string, "null"]
        api_path:
          type: string
        context_length:
          type: [integer, "null"]
        max_completion_tokens:
          type: [integer, "null"]
        max_prompt_tokens:
          type: [integer, "null"]
        quantization:
          type: [string, "null"]
        supported_parameters:
          type: array
          items:
            type: string
        source_fetched_at:
          type: string
          format: date-time
        pricing:
          oneOf:
            - $ref: "#/components/schemas/ModelPricing"
            - type: "null"
    ModelPricing:
      type: object
      required: [currency, prompt, completion, request, image, source_fetched_at]
      properties:
        currency:
          const: USD
        prompt:
          type: string
          pattern: '^\\d+(?:\\.\\d+)?$'
        completion:
          type: string
          pattern: '^\\d+(?:\\.\\d+)?$'
        request:
          type: string
        image:
          type: string
        source_fetched_at:
          type: string
          format: date-time
    Developer:
      type: object
      required: [slug, name, active_models]
      properties:
        slug:
          type: string
        name:
          type: string
        active_models:
          type: integer
    Provider:
      type: object
      required: [slug, name, active_endpoints]
      properties:
        slug:
          type: string
        name:
          type: string
        active_endpoints:
          type: integer
    DeveloperIdentity:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          const: true
        message:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, terms_version, privacy_version, turnstile_token]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        terms_version:
          type: string
          maxLength: 64
        privacy_version:
          type: string
          maxLength: 64
        turnstile_token:
          type: string
          maxLength: 2048
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, turnstile_token]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        turnstile_token:
          type: string
          maxLength: 2048
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token_hash]
      properties:
        token_hash:
          type: string
          minLength: 8
          maxLength: 512
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      required: [email, turnstile_token]
      properties:
        email:
          type: string
          format: email
        turnstile_token:
          type: string
          maxLength: 2048
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token_hash, new_password]
      properties:
        token_hash:
          type: string
          minLength: 8
          maxLength: 512
        new_password:
          type: string
          minLength: 12
          maxLength: 128
    AuthSessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/PublicUser"
            - type: "null"
    AuthenticatedSessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          const: true
        user:
          $ref: "#/components/schemas/PublicUser"
        csrf_token:
          type: string
    PublicUser:
      type: object
      required: [id, email, role, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          enum: [user, support, admin, super_admin]
        status:
          enum: [pending_verification, active, suspended, deletion_pending, deleted]
        email_verified:
          type: boolean
        profile:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
    MeResponse:
      type: object
      required: [user, preferences]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        preferences:
          oneOf:
            - $ref: "#/components/schemas/Preferences"
            - type: "null"
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: [string, "null"]
          minLength: 1
          maxLength: 80
        locale:
          type: string
          minLength: 2
          maxLength: 16
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    Profile:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: [string, "null"]
        locale:
          type: string
        timezone:
          type: string
    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        theme:
          enum: [light, dark, system]
        default_model_id:
          type: [string, "null"]
          maxLength: 255
        notification_preferences:
          type: object
          additionalProperties:
            type: boolean
    Preferences:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        theme:
          type: string
        defaultModelId:
          type: [string, "null"]
        defaultRouting:
          type: [object, "null"]
        notificationPreferences:
          type: [object, "null"]
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [consent_type, document_version]
      properties:
        consent_type:
          enum: [terms, privacy, marketing]
        document_version:
          type: string
          maxLength: 64
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        consentType:
          type: string
        documentVersion:
          type: string
        acceptedAt:
          type: string
          format: date-time
        source:
          type: string
